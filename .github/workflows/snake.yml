name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Render the contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%230969DA&color_dots=%23EBEDF0,%23B6DAFF,%2379C0FF,%232F81F7,%230969DA
            dist/snake-dark.svg?palette=github-dark&color_snake=%2358A6FF&color_dots=%23161B22,%230D419D,%231158C7,%231F6FEB,%2358A6FF

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
